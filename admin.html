<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bhumika Jewellers | Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f8f5ee;
  color:#222;
}

header{
  background:#222;
  color:white;
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  color:#d2aa55;
  font-family:Georgia,serif;
  font-size:22px;
}

button{
  border:none;
  padding:12px 18px;
  border-radius:5px;
  cursor:pointer;
  font-weight:bold;
}

.logout{
  background:#b58b2a;
  color:white;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:25px 15px;
}

.card{
  background:white;
  padding:22px;
  border-radius:10px;
  margin-bottom:25px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.card h2{
  font-family:Georgia,serif;
  margin-bottom:20px;
}

input,textarea,select{
  width:100%;
  padding:13px;
  margin-bottom:15px;
  border:1px solid #ddd;
  border-radius:5px;
  font-size:15px;
}

textarea{
  min-height:90px;
}

.add-btn{
  background:#b58b2a;
  color:white;
  width:100%;
}

.product{
  border:1px solid #eee;
  padding:15px;
  margin-bottom:15px;
  border-radius:8px;
}

.product h3{
  font-family:Georgia,serif;
  margin-bottom:8px;
}

.product p{
  color:#666;
  margin-bottom:6px;
}

.delete{
  background:#c0392b;
  color:white;
  margin-top:10px;
}

.status{
  padding:12px;
  margin-bottom:20px;
  border-radius:5px;
  background:#f1ead7;
}

.hidden{
  display:none;
}

.login{
  max-width:420px;
  margin:80px auto;
  padding:25px;
  background:white;
  border-radius:10px;
}

.login h1{
  text-align:center;
  font-family:Georgia,serif;
  margin-bottom:25px;
  color:#b58b2a;
}

.login button{
  width:100%;
  background:#b58b2a;
  color:white;
}

#error{
  color:#c0392b;
  margin-top:12px;
}

@media(max-width:600px){
  header{
    padding:15px;
  }

  header h1{
    font-size:18px;
  }

  .container{
    padding:15px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login">

  <h1>Bhumika Jewellers</h1>

  <input
    type="email"
    id="email"
    placeholder="Admin Email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
  >

  <button onclick="login()">
    Login
  </button>

  <div id="error"></div>

</div>


<!-- ADMIN PANEL -->
<div id="adminPage" class="hidden">

<header>

  <h1>Admin Panel</h1>

  <button class="logout" onclick="logout()">
    Logout
  </button>

</header>


<div class="container">

  <div class="status" id="status">
    Checking admin access...
  </div>


  <!-- ADD PRODUCT -->

  <div class="card">

    <h2>Add New Jewellery</h2>

    <input
      type="text"
      id="productName"
      placeholder="Product Name"
    >

    <textarea
      id="description"
      placeholder="Product Description"
    ></textarea>

    <select id="category">

      <option value="Rings">Rings</option>

      <option value="Necklaces">Necklaces</option>

      <option value="Earrings">Earrings</option>

      <option value="Bracelets">Bracelets</option>

    </select>

    <input
      type="number"
      id="price"
      placeholder="Price"
    >

    <input
      type="number"
      step="0.01"
      id="weight"
      placeholder="Weight in grams"
    >

    <input
      type="text"
      id="purity"
      placeholder="Purity e.g. 22K Gold"
    >

    <input
      type="number"
      id="stock"
      placeholder="Stock"
      value="1"
    >

    <input
      type="text"
      id="imageUrl"
      placeholder="Product Image URL"
    >

    <button class="add-btn" onclick="addProduct()">
      + Add Product
    </button>

  </div>


  <!-- PRODUCTS -->

  <div class="card">

    <h2>Jewellery Products</h2>

    <div id="products">
      Loading products...
    </div>

  </div>

</div>

</div>


<script>

/* ==============================
   SUPABASE CONFIG
   ============================== */

const SUPABASE_URL = "https://evyqqetjxvdartmlzvbj.supabase.co";

const SUPABASE_ANON_KEY = "sb_publishable_dpD95fI2vGk9mqEKs744jQ_jTQXi0SQ";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* ==============================
   LOGIN
   ============================== */

async function login(){

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const error =
    document.getElementById("error");

  error.innerText = "";

  if(!email || !password){

    error.innerText =
      "Email aur password enter karein.";

    return;
  }

  const { data, error:loginError } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });

  if(loginError){

    error.innerText =
      loginError.message;

    return;
  }

  await checkAdmin();

}


/* ==============================
   CHECK ADMIN
   ============================== */

async function checkAdmin(){

  const {
    data:{
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if(!user){

    showLogin();

    return;
  }


  const {
    data:profile,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id",user.id)
      .single();


  if(error || !profile){

    alert("Profile nahi mila.");

    await logout();

    return;
  }


  if(profile.role !== "admin"){

    alert("Access denied. Sirf admin access kar sakta hai.");

    await logout();

    return;
  }


  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("adminPage")
    .classList.remove("hidden");


  document
    .getElementById("status")
    .innerText =
      "✅ Admin access verified";


  loadProducts();

}


/* ==============================
   SHOW LOGIN
   ============================== */

function showLogin(){

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

  document
    .getElementById("adminPage")
    .classList.add("hidden");

}


/* ==============================
   ADD PRODUCT
   ============================== */

async function addProduct(){

  const name =
    document.getElementById("productName").value;

  const description =
    document.getElementById("description").value;

  const category =
    document.getElementById("category").value;

  const price =
    document.getElementById("price").value;

  const weight =
    document.getElementById("weight").value;

  const purity =
    document.getElementById("purity").value;

  const stock =
    document.getElementById("stock").value;

  const image_url =
    document.getElementById("imageUrl").value;


  if(!name || !price){

    alert("Product name aur price zaroor bharein.");

    return;
  }


  const { error } =
    await supabaseClient
      .from("products")
      .insert({

        name:name,

        description:description,

        category:category,

        price:Number(price),

        weight:weight
          ? Number(weight)
          : null,

        purity:purity,

        stock:stock
          ? Number(stock)
          : 0,

        image_url:image_url

      });


  if(error){

    alert(
      "Product add nahi hua:\n" +
      error.message
    );

    return;
  }


  alert("✅ Product successfully added!");


  document
    .getElementById("productName")
    .value="";

  document
    .getElementById("description")
    .value="";

  document
    .getElementById("price")
    .value="";

  document
    .getElementById("weight")
    .value="";

  document
    .getElementById("purity")
    .value="";

  document
    .getElementById("stock")
    .value="1";

  document
    .getElementById("imageUrl")
    .value="";


  loadProducts();

}


/* ==============================
   LOAD PRODUCTS
   ============================== */

async function loadProducts(){

  const container =
    document.getElementById("products");


  const {
    data,
    error
  } =
    await supabaseClient
      .from("products")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );


  if(error){

    container.innerHTML =
      "<p>Error: " +
      error.message +
      "</p>";

    return;
  }


  if(!data || data.length === 0){

    container.innerHTML =
      "<p>Abhi koi product nahi hai.</p>";

    return;
  }


  container.innerHTML = "";


  data.forEach(product => {

    const div =
      document.createElement("div");

    div.className="product";


    div.innerHTML = `

      <h3>${product.name}</h3>

      <p>
        Category: ${product.category || "-"}
      </p>

      <p>
        Price: ₹${product.price}
      </p>

      <p>
        Weight: ${product.weight || "-"}g
      </p>

      <p>
        Purity: ${product.purity || "-"}
      </p>

      <p>
        Stock: ${product.stock || 0}
      </p>

      <button
        class="delete"
        onclick="deleteProduct('${product.id}')"
      >
        Delete
      </button>

    `;


    container.appendChild(div);

  });

}


/* ==============================
   DELETE PRODUCT
   ============================== */

async function deleteProduct(id){

  if(!confirm("Kya aap is product ko delete karna chahte hain?")){

    return;
  }


  const { error } =
    await supabaseClient
      .from("products")
      .delete()
      .eq("id",id);


  if(error){

    alert(
      "Delete nahi hua:\n" +
      error.message
    );

    return;
  }


  alert("Product deleted.");

  loadProducts();

}


/* ==============================
   LOGOUT
   ============================== */

async function logout(){

  await supabaseClient.auth.signOut();

  showLogin();

}


/* ==============================
   AUTO CHECK
   ============================== */

checkAdmin();

</script>

</body>
  </html>
